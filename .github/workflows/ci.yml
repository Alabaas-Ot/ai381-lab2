name: AI381 Lab 2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run pytest
        run: pytest -v

  build-scan-push:
    name: Build, scan and push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/alabaas-ot/ai381-lab2
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
        with:
          image-ref: ghcr.io/alabaas-ot/ai381-lab2:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG" | awk -F@ '{print $2}')"
          echo "Image: $IMAGE:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
